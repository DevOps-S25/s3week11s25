name: wf-ci
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome to Pipelines"
      - name: Clone Repo On Runner
        uses: actions/checkout@v4
      - name: Repo Information
        run: |
          git branch
          echo "Event Name: ${{github.event_name}}" 
          echo "Actor Name:: ${{github.actor}}"     
      - name: Lint HTML Files 
        run:  npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run:  npx stylelint "**/*.css"